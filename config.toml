theme = "personal_theme"


[editor]
line-number = "relative"
mouse = false
gutters = ["diff", "diagnostics", "line-numbers", "spacer"]
cursorline = true


[editor.lsp]
enable = true
# display-messages = true
snippets = true
goto-reference-include-declaration = true

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.file-picker]
hidden = false

[editor.statusline]
left = [
  "spinner",
  "mode",
  "file-name",
  "read-only-indicator",
  "file-modification-indicator",
]
center = ["version-control"]
right = ["diagnostics", "file-type"]
separator = "│"
mode.normal = "NORMAL"
mode.insert = "INSERT"
mode.select = "SELECT"


[editor.indent-guides]
render = true
character = "╎" # Some characters that work well: "▏", "┆", "┊", "⸽"
skip-levels = 1

[keys.normal]
C-s = ":write"
C-z = ":quit!"
C-q = ":write-quit"
