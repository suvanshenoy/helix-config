#powershell
[language-server.powershell-editor-services]
command = "pwsh"
args = [
  "-NoLogo",
  "-NoProfile",
  "-Command",
  "/home/suvan/main/system-tools/PowerShellEditorServices/PowerShellEditorServices/Start-EditorServices.ps1 -SessionDetailsPath ./session.json  -FeatureFlags @() -AdditionalModules @() -HostName helix -HostProfileId 0 -HostVersion 1.0.0 -Stdio -LogLevel Normal",
]
config = {}

[[language]]
name = "powershell"
indent = { tab-width = 2, unit = "  " }
auto-format = true
language-servers = ["powershell-editor-services"]
#powershell end


#javascript-typescript
[language-server.biome]
command = "biome"
args = ["lsp-proxy"]


[[language]]
name = "javascript"
roots = ["biome.json", "jsconfig.json"]
auto-format = true
indent = { tab-width = 2, unit = "  " }
language-servers = [
  { name = "typescript-language-server", except-features = [
    "signature-help",
    "inlay-hints",
    "format",
  ] },
  "tailwindcss-language-server",
  "biome",
]


[[language]]
name = "typescript"
roots = [
  "biome.json",
  "tsconfig.json",
  "tsconfig.base.json",
  "tsconfig.client.json",
  "tsconfig.app.json",
  "tsconfig.server.json",
  "tsconfig.node.json",
]
auto-format = true
language-servers = [
  { name = "typescript-language-server", except-features = [
    "signature-help",
    "inlay-hints",
    "format",
  ] },
  "tailwindcss-language-server",
  "biome",
]
#javascript-typescript end

