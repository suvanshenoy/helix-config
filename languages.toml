[language-server.lsp-ai]
command = "lsp-ai"

[language-server.lsp-ai.config.memory]
file_store = {}

[language-server.lsp-ai.config]

chat = [

  { trigger = "!C", action_display_name = "Chat", model = "model1", parameters = { contents = [
    { role = "user", parts = [

      { text = "{CODE}" },

    ] },

  ], systemInstruction = { role = "system", parts = [

    { text = "You are a code assistant chatbot. The user will ask you for assistance coding and you will do you best to answer succinctly and accurately.\n" },

  ] } } },
]


[language-server.lsp-ai.config.models.model1]
type = "gemini"
model = "gemini-2.5-flash-latest"
auth_token_env_var_name = "GEMINI_API_KEY"


[language-server.lsp-ai.config.actions.parameters]
max_content = 2048
max_tokens = 1024
temperature = 0.1


#javascript-typescript
[language-server.biome]
command = "biome"
args = ["lsp-proxy"]

[language-server.oxlint]
command = "oxlint"
args = ["--lsp"]

[language-server.deno-lsp]
command = "deno"
args = ["lsp"]
config.deno.enable = true

