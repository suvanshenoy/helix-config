#astro
[language-server.astro-ls]
command = "astro-ls"
args = ["--stdio"]
config = { "typescript" = { "tsdk" = "~/.bun/install/global/node_modules/typescript/lib/" }, enviroment = "node" }

[[language]]
name = "astro"
roots = ["package.json", "astro.config.mjs", "astro.config.ts"]
auto-format = true
language-servers = ["astro-ls", "biome", "tailwind-lsp"]
#astro end

#elixir
[language-server.elixir-ls]
command = "elixir-ls"

[language-server.elixir-ls.config.elixirLS]
dialyzerEnabled = true

[language-server.expert]
command = "~/system-tools/expert_linux_amd64"

[[language]]
name = "elixir"
file-types = ["ex", "exs"]
roots = ["mix.exs"]
auto-format = true
language-servers = [
  { name = "elixir-ls", except-features = [
    "signature-help",
    "inlay-hints",
  ] },
  { name = "expert" },

]
#elixir end


