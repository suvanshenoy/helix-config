#css
[[language]]
name = "css"
scope = "source.css"
file-types = ["css"]
auto-format = true
language-servers = ["tailwindcss-language-server", "vscode-css-language-server"]
#css end


#html
[[language]]
name = "html"
language-servers = [
  "vscode-html-language-server",
  "tailwindcss-language-server",
]
#html end

#markdown
[language-server.harper-ls]
command = "harper-ls"
args = ["--stdio"]
config = {}

[[language]]
name = "markdown"
scope = "source.md"
file-types = ["md"]
auto-format = true
formatter = { command = "mdformat", args = ["-"] }
language-servers = ["harper-ls"]
#markdown end

#toml
[[language]]
name = "toml"
scope = "source.toml"
file-types = ["toml"]
indent = { tab-width = 2, unit = "  " }
formatter = { command = "taplo", args = ["fmt", "-"] }
auto-format = true
language-servers = ["taplo"]
#toml end

#go
[language-server.golangci-lint-langserver]
command = "golangci-lint-langserver"

[language-server.golangci-lint-langserver.config]
command = [
  "golangci-lint",
  "run",
  "--out-format",
  "json",
  "--issues-exit-code=1",
]

[[language]]
name = "go"
scope = "source.go"
file-types = ["go"]
auto-format = true
indent = { tab-width = 2, unit = "  " }
formatter = { command = "gofmt" }
language-servers = [
  { name = "gopls", only-features = [
    "goto-definition",
    "goto-declaration",
    "goto-type-definition",
    "goto-reference",
    "goto-implementation",
    "document-highlight",
    "workspace-command",
    "document-symbols",
    "workspace-symbols",
    "rename-symbol",
    "diagnostics",
    "completion",
  ] },
  "golangci-lint-langserver",
]
#go end

#vue 
[[language-server.typescript-language-server.config.plugins]]
name = "@vue/typescript-plugin"
location = "D:/.bun/install/global/node_modules/@vue/language-server"
languages = ["vue"]

[[language]]
name = "vue"
auto-format = true
formatter = { command = "prettier", args = ["--parser", "vue"] }
language-servers = ["typescript-language-server"]
#vue end
