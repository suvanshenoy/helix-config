  { name = "biome" },
  { name = "vscode-css-language-server", except-features = [
    "format",
  ] },
  { name = "tailwindcss-language-server", except-features = [
    "format",
  ] },
]
#css end

#html
[language-server.vscode-html-language-server]
command = "vscode-html-language-server"
args = ["--stdio"]

[[language]]
name = "html"
auto-format = true
language-servers = [{ name = "vscode-html-language-server" }]
#html end

#markdown
[language-server.markdown-oxide]
command = "markdown-oxide"

[language.formatter]
command = "dprint"
args = ["fmt", "--stdin", "md"]

[[language]]
name = "markdown"
auto-format = true
language-servers = ["markdown-oxide"]
#markdown end

#toml
[[language]]
name = "toml"
formatter = { command = "taplo", args = ["fmt", "-"] }
auto-format = true
language-servers = ["taplo"]
#toml end

#yaml
[language-server.yaml-language-server]
command = "yaml-language-server"
args = ["--stdio"]

[[language]]
name = "yaml"
auto-format = true
language-servers = ["yaml-language-server"]
#yaml


#dockerfile
[language-server.docker-langserver]
command = "docker-langserver"

[[language]]
name = "dockerfile"
auto-format = true
language-servers = ["docker-langserver"]
#dockerfile


#yaml
[[language]]
name = "docker-compose"
auto-format = true
formatter = { command = "prettier", args = ["--parser", "yaml"] }
language-servers = ["yaml-language-server"]
#yaml

#astro
[language-server.astro-ls]
command = "astro-ls"
args = ["--stdio"]
config = { "typescript" = { "tsdk" = "/home/hp/.bun/install/global/node_modules/typescript/lib/" }, enviroment = "node" }

[language-server.htmx-lsp]
command = "htmx-lsp"

[[language-server.typescript-language-server.config.plugins]]
name = "@astrojs/ts-plugin"
location = "/home/hp/.bun/install/global/node_modules/@astrojs/ts-plugin"
languages = ["astro"]

[[language]]
name = "astro"
roots = ["package.json", "astro.config.mjs", "astro.config.ts"]
auto-format = true
language-servers = [
  { name = "astro-ls", except-features = [
    "signature-help",
  ] },
  { name = "htmx-lsp" },
  { name = "biome" },
]
#astro end

#nix
[language-server.nixd]
command = "nixd"

[language-server.nil]
command = "nil"

[[language]]
name = "nix"
auto-format = true
language-servers = [{ name = "nixd" }, { name = "nil" }]
#nix end

#dart
[language-server.dart-lsp]
command = "dart"
args = ["language-server", "--client-id=helix"]

[language-server.dart-lsp.config]
closingLabels = true
outline = true
flutterOnline = true

[language-server.dart-lsp.config.dart]
completeFunctionCalls = true
showTodos = true
renameFilesWithClasses = "always"
enableSnippets = true
inlayHints = true


[[language]]
name = "dart"
roots = ["pubspec.yaml"]
auto-format = true
language-servers = [{ name = "dart-lsp", except-features = ["signature-help"] }]
#dart end

#vue 
[language-server.vue-language-server]
command = "vue-language-server"
args = ["--stdio"]

[[language-server.typescript-language-server.config.plugins]]
name = "@vue/typescript-plugin"
location = "/home/hp/.bun/install/global/node_modules/@vue/language-server"
languages = ["vue"]

[[language]]
name = "vue"
auto-format = true
language-servers = [
  { name = "vue-language-server" },
  { name = "typescript-language-server", except-features = [
    "signature-help",
    "format",
    "diagnostics",
  ] },
  { name = "vscode-html-language-server" },
  { name = "biome" },
]
#vue end
