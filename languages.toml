#javascript-typescript
[language-server.biome]
command = "biome"
args = ["lsp-proxy"]

[language-server.tsgo]
command = "tsgo"
args = ["--lsp", "--stdio"]

[language-server.typescript-language-server]
command = "typescript-language-server"
args = ["--stdio"]

[[language]]
name = "javascript"
file-types = ["mjs", "js", "jsx"]
auto-format = true
language-servers = [
  { name = "tsgo", except-features = [
    "signature-help",
    "format",
    "hover",
    "completion",
  ] },
  { name = "typescript-language-server", except-features = [
    "signature-help",
    "format",
    "code-action",
    "goto-reference",
    "goto-implementation",
    "goto-type-definition",
    "goto-declaration",
    "goto-definition",
  ] },

  { name = "biome" },
  { name = "tailwindcss-language-server" },
]


[[language]]
name = "typescript"
file-types = ["mts", "ts", "tsx"]
auto-format = true
language-servers = [
  { name = "tsgo", except-features = [
    "signature-help",
    "format",
    "hover",
    "completion",
  ] },
  { name = "typescript-language-server", except-features = [
    "signature-help",
    "format",
    "code-action",
    "goto-reference",
    "goto-implementation",
    "goto-type-definition",
    "goto-declaration",
    "goto-definition",
  ] },

  { name = "biome" },
  { name = "tailwindcss-language-server" },
]

#javascript-typescript end

#jsonc
[[language]]
name = "jsonc"
file-types = ["json", "develop"]
language-servers = [
  { name = "biome" },
  { name = "vscode-json-language-server", except-features = [
    "format",
  ] },
]
#jsonc end

[language-server.tailwindcss-language-server]
command = "tailwindcss-language-server"
args = ["--stdio"]
config = {}


#css
[language-server.vscode-css-language-server]
command = "vscode-css-language-server"

[[language]]
name = "css"
auto-format = true
language-servers = [
  { name = "biome" },
  { name = "vscode-css-language-server", except-features = [
    "format",
  ] },
  { name = "tailwindcss-language-server", except-features = [
    "format",
  ] },
]

[[language]]
name = "scss"
auto-format = true
