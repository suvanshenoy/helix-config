#powershell
[language-server.powershell-editor-services]
command = "pwsh"
args = [
  "-NoLogo",
  "-NoProfile",
  "-Command",
  "/home/suvan/main/system-tools/PowerShellEditorServices/PowerShellEditorServices/Start-EditorServices.ps1 -SessionDetailsPath ./session.json  -FeatureFlags @() -AdditionalModules @() -HostName helix -HostProfileId 0 -HostVersion 1.0.0 -Stdio -LogLevel Normal",
]
config = {}

[[language]]
name = "powershell"
indent = { tab-width = 2, unit = "  " }
auto-format = true
language-servers = ["powershell-editor-services"]
#powershell end


#javascript-typescript
[language-server.biome]
command = "biome"
args = ["lsp-proxy"]

[language-server.tsgo]
command = "tsgo"
args = ["--lsp", "--stdio"]

[language-server.typescript-language-server]
command = "typescript-language-server"
args = ["--stdio"]

[[language]]
name = "javascript"
roots = ["jsconfig.json"]
file-types = ["mjs", "js"]
auto-format = true
language-servers = [
  { name = "tsgo", except-features = [
    "signature-help",
    "inlay-hints",
    "format",
  ] },
  { name = "typescript-language-server", except-features = [
    "signature-help",
    "inlay-hints",
    "format",
  ] },
  { name = "biome" },
  # { name = "biome", except-features = [
  #   "format",
  # ] },
]

[[language]]
name = "typescript"
roots = ["tsconfig.json"]
file-types = ["mts", "ts"]
auto-format = true
language-servers = [
  "biome",
  { name = "tsgo", except-features = [
    "signature-help",
    "inlay-hints",
    "format",
  ] },
  { name = "typescript-language-server", except-features = [
    "signature-help",
    "inlay-hints",
    "format",
  ] },
]
#javascript-typescript end

