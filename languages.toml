#javascript-typescript
[language-server.biome]
command = "biome"
args = ["lsp-proxy"]


[[language]]
name = "javascript"
scope = "source.js"
file-types = ["cjs", "js", "mjs"]
auto-format = true
indent = { tab-width = 2, unit = "  " }
language-servers = [
  { name = "typescript-language-server", only-features = [
    "goto-definition",
    "goto-declaration",
    "goto-type-definition",
    "goto-reference",
    "goto-implementation",
    "document-highlight",
    "workspace-command",
    "document-symbols",
    "workspace-symbols",
    "rename-symbol",
    "diagnostics",
    "completion",
  ] },
  "tailwindcss-language-server",
  "biome",
]


[[language]]
name = "typescript"
scope = "source.ts"
file-types = ["ts"]
auto-format = true
indent = { tab-width = 2, unit = "  " }
language-servers = [
  { name = "typescript-language-server", only-features = [
    "goto-definition",
    "goto-declaration",
    "goto-type-definition",
    "goto-reference",
    "goto-implementation",
    "document-highlight",
    "workspace-command",
    "document-symbols",
    "workspace-symbols",
    "rename-symbol",
    "diagnostics",
    "completion",
  ] },
  "tailwindcss-language-server",
  "biome",
]
#javascript-typescript end

#json
[[language]]
name = "json"
scope = "source.json"
file-types = ["json"]
language-servers = [
  { name = "vscode-json-language-server", except-features = [
    "format",
  ] },
  "biome",
]
#json end

[language-server.tailwindcss-language-server]
command = "tailwindcss-language-server"
args = ["--stdio"]
