#javascript-typescript
[language-server.biome]
command = "biome"
args = ["lsp-proxy"]

[language-server.tsgo]
command = "tsgo"
args = ["--lsp", "--stdio"]

[language-server.typescript-language-server]
command = "typescript-language-server"
args = ["--stdio"]

[language-server.deno-lsp]
command = "deno"
args = ["lsp"]

[language-server.deno-lsp.config.deno]
enable = true

[[language]]
name = "javascript"
roots = ["package.json", "jsconfig.json"]
file-types = ["mjs", "js", "jsx"]
auto-format = true
language-servers = [
  { name = "typescript-language-server", except-features = [
    "signature-help",
    "inlay-hints",
    "format",
  ] },
  { name = "biome" },
  { name = "tailwindcss-language-server" },
]

[[language]]
name = "typescript"
roots = ["deno.json", "package.json", "tsconfig.json"]
file-types = ["mts", "ts","tsx"]
auto-format = true
language-servers = [
  { name = "deno-lsp", except-features = [
    "signature-help",
    "inlay-hints",
  ] },
  { name = "biome" },
]



[[language]]
name = "tsx"
roots = ["deno.json", "package.json", "tsconfig.json"]
auto-format = true
language-servers = [
  { name = "deno-lsp", except-features = [
    "signature-help",
    "inlay-hints",
  ] },
  { name = "biome" },
  { name = "tailwindcss-language-server" },
]

#javascript-typescript end

#json
[language-server.vscode-json-language-server]
command = "vscode-json-language-server"
args = ["--stdio"]

[[language]]
name = "json"
file-types = ["json", "develop"]
language-servers = [
  { name = "biome" },
  { name = "vscode-json-language-server", except-features = [
    "format",
  ] },

]
#json end

