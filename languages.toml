#javascript-typescript
[language-server.biome]
command = "biome"
args = ["lsp-proxy"]

[language-server.oxlint]
command = "oxlint"
args = ["--lsp"]

[language-server.tsgo]
command = "tsgo"
args = ["--lsp", "--stdio"]

[language-server.typescript-language-server]
command = "typescript-language-server"
args = ["--stdio"]

[[language]]
name = "javascript"
file-types = ["mjs", "js", "cjs"]
auto-format = true
language-servers = [
  { name = "tsgo", except-features = [
    "signature-help",
    "format",
    "hover",
    "completion",
  ] },
  { name = "typescript-language-server", except-features = [
    "signature-help",
    "format",
    "code-action",
    "goto-reference",
    "goto-implementation",
    "goto-type-definition",
    "goto-declaration",
    "goto-definition",
  ] },
  { name = "biome" },
  { name = "tailwindcss-language-server" },
]


