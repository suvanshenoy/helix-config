#astro
[language-server.astro-ls]
command = "astro-ls"
args = ["--stdio"]
config = { "typescript" = { "tsdk" = "/home/hp/.bun/install/global/node_modules/typescript/lib/" }, enviroment = "node" }

[language-server.htmx-lsp]
command = "htmx-lsp"

[[language-server.typescript-language-server.config.plugins]]
name = "@astrojs/ts-plugin"
location = "/home/hp/.bun/install/global/node_modules/@astrojs/ts-plugin"
languages = ["astro"]

[[language]]
name = "astro"
roots = ["package.json", "astro.config.mjs", "astro.config.ts"]
auto-format = true
language-servers = [
  { name = "astro-ls", except-features = [
    "signature-help",
    "format",
  ] },
  { name = "biome" },
]
#astro end

#nix
[language-server.nixd]
command = "nixd"

[language-server.nil]
command = "nil"

[[language]]
name = "nix"
auto-format = true
language-servers = [{ name = "nixd" }, { name = "nil" }]
#nix end

#dart
[language-server.dart-lsp]
command = "dart"
args = ["language-server", "--client-id=helix"]

[language-server.dart-lsp.config]
closingLabels = true
outline = true
flutterOnline = true

[language-server.dart-lsp.config.dart]
completeFunctionCalls = true
showTodos = true
renameFilesWithClasses = "always"
enableSnippets = true
inlayHints = true


[[language]]
name = "dart"
roots = ["pubspec.yaml"]
auto-format = true
language-servers = [{ name = "dart-lsp", except-features = ["signature-help"] }]
#dart end

#elixir
[language-server.expert-lsp]
command = "expert"
args = ["--stdio"]

[[language]]
name = "elixir"
auto-format = true
language-servers = [{ name = "expert-lsp" }]


[[language]]
name = "heex"
auto-format = true
language-servers = [{ name = "expert-lsp" }]
#elixir end

#go
[language-server.gopls]
command = "gopls"

[language-server.golangci-lint-langserver]
command = "golangci-lint-langserver"

[language-server.golangci-lint-langserver.config]
command = [
  "golangci-lint",
  "run",
  "--output.json.path",
  "stdout",
  "--show-stats=false",
  "--issues-exit-code=1",
]

[[language]]
name = "go"
auto-format = true
formatter = { command = "gofmt" }
language-servers = [
  { name = "gopls", except-features = [
    "signature-help",
    "inlay-hints",
  ] },
  "golangci-lint-langserver",
]
#go end

#gleam
[language-server.gleam-lsp]
command = "gleam"
args = ["lsp"]

[[language]]
name = "gleam"
auto-format = true
language-servers = [
  { name = "gleam-lsp", except-features = [
    "signature-help",
    "inlay-hints",
  ] },
]
#gleam end

#python
[language-server.pyright]
command = "pyright-langserver"
args = ["--stdio"]

[language-server.ruff]
command = "ruff"
args = ["server"]
environment = { "RUFF_TRACE" = "messages" }

[language-server.ruff.config.settings]
lineLength = 80
logLevel = "debug"

[language-server.ruff.config.settings.lint]
select = [
  "E",
  "F",
  "W",
  "B",
  "I",
  "RUF",
  "N",
  "LOG",
  "ERA",
  "W",
  "D",
  "UP",
  "ANN",
  "ASYNC",
  "S",
  "RET",
  "TCH",
  "ARG",
  "PTH",
  "DOC",
]
preview = true

[language-server.ruff.config.settings.format]
preview = true
quote-style = "double"
docstring-code-format = true
indent-style = "space"

[[language]]
name = "python"
roots = ["pyproject.toml", "setup.py", "poetry.lock", ".git", ".jj", ".venv/"]
file-types = ["py", "ipynb", "pyi"]
auto-format = true
language-servers = [
  { name = "ruff" },
  { name = "pyright", except-features = [
    "signature-help",
    "inlay-hints",
  ] },
]

[language.formatter]
command = "ruff"
args = ["format", "-"]
#python end

# nim
[language-server.nimlangserver]
command = "nimlangserver"
args = ["stdio"]

[language-server.nimlangserver.config.nim]
autoCheckProject = true
autoCheckFile = true
checkOnSave = true
useNimCheck = true
autoRestart = true

[[language]]
name = "nim"
auto-format = true
language-servers = [
  { name = "nimlangserver", except-features = [
    "signature-help",
    "inlay-hints",
  ] },

]
#nim end
