#javascript-typescript
[language-server.biome]
command = "biome"
args = ["lsp-proxy"]

[language-server.tsgo]
command = "tsgo"
args = ["--lsp", "--stdio"]

[language-server.typescript-language-server]
command = "typescript-language-server"
args = ["--stdio"]

[language-server.deno-lsp]
command = "deno"
args = ["lsp"]

[language-server.deno-lsp.config.deno]
enable = true

[[language]]
name = "javascript"
roots = ["package.json", "jsconfig.json"]
file-types = ["mjs", "js", "jsx"]
auto-format = true
language-servers = [
  { name = "typescript-language-server", except-features = [
    "signature-help",
    "format",
  ] },
  { name = "biome" },
  { name = "tailwindcss-language-server" },
]

[[language]]
name = "typescript"
roots = ["deno.json", "package.json", "tsconfig.json"]
file-types = ["mts", "ts"]
auto-format = true
language-servers = [
  { name = "deno-lsp", except-features = [
    "signature-help",
  ] },
  { name = "biome" },
]


[[language]]
name = "tsx"
roots = ["deno.json", "package.json", "tsconfig.json"]
auto-format = true
language-servers = [
  { name = "deno-lsp", except-features = [
    "signature-help",
  ] },
  { name = "biome" },
  { name = "tailwindcss-language-server" },
]

#javascript-typescript end

#jsonc
[[language]]
name = "jsonc"
file-types = ["json", "develop"]
language-servers = [
  { name = "biome" },
  { name = "vscode-json-language-server", except-features = [
    "format",
  ] },
]
#jsonc end

[language-server.tailwindcss-language-server]
command = "tailwindcss-language-server"
args = ["--stdio"]
config = {}


#css
[language-server.vscode-css-language-server]
command = "vscode-css-language-server"

[[language]]
name = "css"
auto-format = true
language-servers = [
  { name = "biome" },
  { name = "vscode-css-language-server", except-features = [
    "format",
  ] },
  { name = "tailwindcss-language-server", except-features = [
    "format",
  ] },
]

[[language]]
name = "scss"
auto-format = true
language-servers = [
  { name = "biome" },
  { name = "vscode-css-language-server", except-features = [
    "format",
  ] },
  { name = "tailwindcss-language-server", except-features = [
    "format",
  ] },
]
#css end

#html
[language-server.vscode-html-language-server]
command = "vscode-html-language-server"
args = ["--stdio"]

[[language]]
name = "html"
auto-format = true
language-servers = [{ name = "vscode-html-language-server" }]
#html end

#markdown
[language-server.markdown-oxide]
command = "markdown-oxide"

[language.formatter]
command = "dprint"
args = ["fmt", "--stdin", "md"]

[[language]]
name = "markdown"
auto-format = true
language-servers = ["markdown-oxide"]
#markdown end

#toml
[[language]]
name = "toml"
formatter = { command = "taplo", args = ["fmt", "-"] }
auto-format = true
language-servers = ["taplo"]
#toml end

#yaml
[language-server.yaml-language-server]
command = "yaml-language-server"
args = ["--stdio"]

[[language]]
name = "yaml"
auto-format = true
language-servers = ["yaml-language-server"]
#yaml


#dockerfile
[language-server.docker-langserver]
command = "docker-langserver"

[[language]]
name = "dockerfile"
auto-format = true
language-servers = ["docker-langserver"]
#dockerfile


#yaml
[[language]]
name = "docker-compose"
auto-format = true
formatter = { command = "prettier", args = ["--parser", "yaml"] }
language-servers = ["yaml-language-server"]
#yaml

#astro
[language-server.astro-ls]
command = "astro-ls"
args = ["--stdio"]
config = { "typescript" = { "tsdk" = "~/.bun/install/global/node_modules/typescript/lib/" }, enviroment = "node" }

[[language]]
name = "astro"
roots = ["package.json", "astro.config.mjs", "astro.config.ts"]
auto-format = true
language-servers = ["astro-ls", "biome", "tailwind-lsp"]
#astro end

#nix
[language-server.nixd]
command = "nixd"

[language-server.nil]
command = "nil"

[[language]]
name = "nix"
auto-format = true
language-servers = [{ name = "nixd" }, { name = "nil" }]
#nix end

#dart
[language-server.dart-lsp]
command = "dart"
args = ["language-server", "--client-id=helix"]

[language-server.dart-lsp.config]
closingLabels = true
outline = true
flutterOnline = true

[language-server.dart-lsp.config.dart]
completeFunctionCalls = true
showTodos = true
renameFilesWithClasses = "always"
enableSnippets = true
inlayHints = true


[[language]]
name = "dart"
roots = ["pubspec.yaml"]
auto-format = true
language-servers = [{ name = "dart-lsp", except-features = ["signature-help"] }]
#dart end

#cpp
[language-server.clangd]
command = "clangd-21"
args = ["--background-index", "--compile-commands-dir=./build"]


[[language]]
name = "cpp"
file-types = ["cpp", "cc", "cxx", "hpp", "hh", "hxx"]
auto-format = true
language-servers = [{ name = "clangd", except-features = ["signature-help"] }]

[language-server.mesonlsp]
command = "mesonlsp"
args = ["--lsp"]

[[language]]
name = "meson"
auto-format = true
language-servers = [{ name = "mesonlsp" }]
#cpp end
