#rust
[language-server.rust-analyzer]
command = "rust-analyzer"

[language-server.rust-analyzer.config.cargo]
features = "all"

[language-server.rust-analyzer.config.check]
command = "clippy"

[language-server.rust-analyzer.config]
inlayHints.bindingModeHints.enable = false
inlayHints.chainingHints.enable = true
inlayHints.discriminantHints.enable = "fieldless"
inlayHints.lifetimeElisionHints.enable = "skip_trivial"
inlayHints.typeHints.hideClosureInitialization = false
inlayHints.closingBraceHints.minLines = 10
inlayHints.closureCaptureHints.enable = true
inlayHints.closureReturnTypeHints.enable = "with_block"
inlayHints.genericParameterHints.type.enable = true
inlayHints.implicitDrops.enable = true
inlayHints.impliciSizedBoundHints.enable = true
inlayHints.parameterHints.missingArguments.enable = true
inlayHints.parameterHints.rangeExclusiveHints.enable = true

[[language]]
name = "rust"
roots = ["Cargo.toml", "Cargo.lock"]
auto-format = true
language-servers = [
  { name = "rust-analyzer", except-features = [
    "signature-help",
    "inlay-hints",
  ] },
  { name = "lsp-ai" },
]
#rust end

