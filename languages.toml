#powershell
[language-server.powershell-editor-services]
command = "pwsh"
args = [
  "-NoLogo",
  "-NoProfile",
  "-Command",
  "D:/system-tools/PowershellEditorSevices/PowerShellEditorServices/Start-EditorServices.ps1 -SessionDetailsPath ./session.json  -FeatureFlags @() -AdditionalModules @() -HostName helix -HostProfileId 0 -HostVersion 1.0.0 -Stdio -LogLevel Normal",
]
config = {}

[[language]]
name = "powershell"
auto-format = true
language-servers = ["powershell-editor-services"]
#powershell end

