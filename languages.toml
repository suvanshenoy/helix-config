#python
[language-server.pyright]
command = "pyright-langserver"
args = ["--stdio"]


[language-server.ruff]
command = "ruff"
args = ["server"]
environment = { "RUFF_TRACE" = "messages" }


[language-server.ruff.config.settings]
lineLength = 80
logLevel = "debug"

[language-server.ruff.config.settings.lint]
select = [
  "E",
  "F",
  "W",
  "B",
  "I",
  "RUF",
  "N",
  "LOG",
  "ERA",
  "W",
  "D",
  "UP",
  "ANN",
  "ASYNC",
  "S",
  "RET",
  "TCH",
  "ARG",
  "PTH",
  "DOC",
]
preview = true

[language-server.ruff.config.settings.format]
preview = true
quote-style = "double"
docstring-code-format = true
indent-style = "space"


[[language]]
name = "python"
scope = "source.py"
file-types = ["py"]
auto-format = true
indent = { tab-width = 2, unit = "  " }
formatter = { command = "ruff", args = ["format", "-"] }
language-servers = ["ruff", "pyright"]
#python end

#bash
[language-server.bash-lsp]
command = "bash-language-server"
args = ["start"]

[[language]]
name = "bash"
scope = "source.sh"
indent = { tab-width = 2, unit = "  " }
auto-format = true
language-servers = ["bash-lsp"]
#bash end

#javascript-typescript
[language-server.biome]
command = "biome"
args = ["lsp-proxy"]


[[language]]
name = "javascript"
scope = "source.js"
file-types = ["ejs", "cjs", "js", "mjs"]
auto-format = true
indent = { tab-width = 2, unit = "  " }
language-servers = [
  { name = "typescript-language-server", except-features = [
    "format",
  ] },
  "biome",
]


[[language]]
name = "typescript"
scope = "source.ts"
file-types = ["ts"]
auto-format = true
indent = { tab-width = 2, unit = "  " }
language-servers = [
  { name = "typescript-language-server", except-features = [
    "format",
  ] },
  "biome",
]
#javascript-typescript end

#json
[[language]]
name = "json"
scope = "source.json"
file-types = ["json"]
language-servers = [
  { name = "vscode-json-language-server", except-features = [
    "format",
  ] },
  "biome",
]
#json end

[language-server.tailwindcss-language-server]
command = "tailwindcss-language-server"
args = ["--stdio"]
config = {}

#jsx
[[language]]

name = "jsx"
scope = "source.jsx"
file-types = ["jsx"]
roots = ["tailwind.config.mjs"]

indent = { tab-width = 4, unit = "\t" }
auto-format = true
language-servers = [
  { name = "typescript-language-server", except-features = [
    "format",
  ] },
  "tailwindcss-language-server",
  "biome",
]
#jsx end

#css
[[language]]
name = "css"
scope = "source.css"
file-types = ["css"]
roots = ["tailwind.config.mjs", ".prettierrc.json"]
auto-format = true
language-servers = ["tailwindcss-language-server", "vscode-css-language-server"]
#css end


#html
[[language]]
name = "html"
language-servers = [
  "vscode-html-language-server",
  "tailwindcss-language-server",
]
#html end

#nix 
[language-server.nix-lsp]
command = "nixd"

[[language]]
name = "nix"
scope = "source.nix"
file-types = ["nix"]
indent = { tab-width = 2, unit = "  " }
formatter = { command = "alejandra" }
auto-format = true
language-servers = ["nix-lsp"]
#nix end

#markdown
[language-server.harper-ls]
command = "harper-ls"
args = ["--stdio"]
config = {}

[[language]]
name = "markdown"
scope = "source.md"
file-types = ["md"]
auto-format = true
formatter = { command = "mdformat", args = ["-"] }
language-servers = ["harper-ls"]
#markdown end

#toml
[[language]]
name = "toml"
scope = "source.toml"
file-types = ["toml"]
auto-format = true
#toml end

#cpp
[language-server.clangd]
command = "clangd"
args = ["--background-index"]

[[language]]
name = "cpp"
scope = "source.cpp"
file-types = ["cpp", "cxx", "cc", "hh", "hpp", "hxx"]
auto-format = true
indent = { tab-width = 2, unit = "  " }
formatter = { command = "clang-format" }
language-servers = ["clangd"]
#cpp end


#go
[language-server.golangci-lint-langserver]
command = "golangci-lint-langserver"

[language-server.golangci-lint-langserver.config]
command = [
  "golangci-lint",
  "run",
  "--out-format",
  "json",
  "--issues-exit-code=1",
]

[[language]]
name = "go"
scope = "source.go"
file-types = ["go"]
auto-format = true
indent = { tab-width = 2, unit = "  " }
formatter = { command = "gofmt" }
language-servers = ["gopls", "golangci-lint-langserver"]
#go end
