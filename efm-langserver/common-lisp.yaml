version: 2
root-markers:
  - ocicl.asd
  - .git/
lint-debounce: 500ms
tools:
  ocicl-lint: &ocicl-lint
    - lint-command: "ocicl lint ${INPUT}"
      # `ocicl lint` takes a path, not stdin
      lint-stdin: false
      lint-after-open: true
      # lint-on-save: true
      lint-ignore-exit-code: true
      lint-source: "ocicl-lint"
      lint-severity: 1
      lint-formats:
        - "%f:%l:%c: %m"

languages:
  common-lisp: *ocicl-lint
